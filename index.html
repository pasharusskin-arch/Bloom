:root{--ink:#35483b;--paper:#f8f5ef;--sage:#a8b5a2;--rose:#e8cdd2;--gold:#e5c27b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#e8cdd2aa,transparent 40%),var(--paper);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font:italic 42px Georgia}small{color:#627263}h1,h2{font-family:Georgia;font-weight:normal}h1{font-size:34px;margin:8px 0}h2{font-size:24px}button,input,select,textarea{font:inherit}button{border:0;border-radius:16px;padding:12px 16px;background:#e4e9df;color:var(--ink);cursor:pointer}button.primary{background:var(--ink);color:white}button.active{background:var(--ink);color:white}input,select,textarea{width:100%;padding:12px;border:1px solid #d9ded4;border-radius:12px;background:#fffdf9;color:var(--ink)}textarea{min-height:90px}.card{background:#fffdf9;border:1px solid #e7e4db;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #35483b09}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hero{background:linear-gradient(135deg,#e2eadb,#f0dce4);padding:25px;border-radius:28px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.quest{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee9e1;padding:12px 0}.quest span{flex:1}.done{text-decoration:line-through;opacity:.65}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9ee;display:flex;justify-content:center;gap:5px;padding:10px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e7e4db;z-index:3}nav button{font-size:12px;background:transparent;padding:10px}nav button.active{background:#e0e8da;color:var(--ink)}.avatar{width:100%;height:330px;background:radial-gradient(ellipse,#e8e5d3,#e1e9df 65%,#f7f3eb);border-radius:24px}.controls label{display:block;margin:10px 0 4px;font-size:13px}.bar{height:9px;background:#e6e8df;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#829b79}.memory img{max-width:100%;max-height:280px;border-radius:15px}.muted{color:#68776a;font-size:14px}.hidden{display:none}.pill{background:#f2e5c8;border-radius:20px;padding:8px 12px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.avatar{height:290px}main{padding-top:15px}}
body{background:radial-gradient(ellipse at 90% 0,#efd4dbaa,transparent 40%),#f8f1e5}.card{border-color:#dfcba5;box-shadow:0 8px 26px #8b683512}.hero{background:linear-gradient(135deg,#e1e9d2,#f5e2c7,#eed8df);border:1px solid #d7bd88}.logo{color:#65502b}.pill{border:1px solid #d4b678}button.primary{background:#506442}nav{flex-wrap:wrap;gap:2px}nav button{padding:8px;font-size:12px}main{padding-bottom:150px}h1,h2{color:#51452f}main{padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(100px + env(safe-area-inset-bottom))}nav{flex-wrap:nowrap;justify-content:space-around;gap:0;padding-left:4px;padding-right:4px;background:#fffaf1f7}nav button{flex:1;min-width:0;padding:8px 1px;font-size:10px;line-height:1.3;white-space:normal}nav button .ni{display:block;font-size:21px;margin-bottom:3px}header{gap:8px}.hero{position:relative;overflow:hidden}.hero:after{content:"✿";position:absolute;right:12px;top:4px;color:#b49a68;opacity:.35;font-size:42px;pointer-events:none}@media(max-width:650px){main{padding-top:calc(14px + env(safe-area-inset-top))}} .scene{display:block;width:100%;height:auto;border-radius:18px;border:1px solid #c9aa72}.painted-avatar{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #dfcba5}.painted-avatar img{display:block;width:100%;height:440px;object-fit:contain;mix-blend-mode:multiply}.location{padding:10px 10px 16px}.location h2,.location p{margin:12px 10px}.hero{background:linear-gradient(135deg,#f4ead3,#f9e9df);box-shadow:inset 0 0 0 4px #fff7e580}.card{background:#fffaf1}.bar i{background:linear-gradient(90deg,#78916b,#b2be82)}details{margin:12px 0}summary{cursor:pointer;color:#68776a;font-size:14px}@media(max-width:650px){.painted-avatar img{height:370px}}.worldmap{position:relative;max-width:550px;margin:18px auto}.worldmap svg{display:block;width:100%}.mapnode{position:absolute;width:42%;background:#fffaf0eF;border:1px solid #c6ac78;box-shadow:0 5px 15px #65502b22;font-size:13px;padding:8px}.mapnode b,.mapnode small{display:block}.mapnode b{font-size:28px}.mapnode.house{left:3%;top:10%}.mapnode.forest{right:3%;top:10%}.mapnode.garden{left:29%;top:60%}button:disabled{opacity:.45;cursor:default}.map-back{display:block;margin:0 0 18px}input,select,textarea{display:block;min-width:0;max-width:100%;box-sizing:border-box}input[type=date]{-webkit-appearance:none;appearance:none;width:100%;min-height:48px;text-align:center}input[type=date]::-webkit-date-and-time-value{text-align:center}html{min-height:100%;background:#f8f1e5}body{min-height:100dvh;background-repeat:no-repeat}main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}</style><main><header><div><div class="logo">Bloom.</div><small>Искусство жить · Маленькие шаги 0.6</small></div><div id="balance" class="pill"></div></header><div id="app"></div></main><nav id="nav"></nav><noscript><p style="padding:24px">Для запуска Bloom открой сайт в Safari с включённым JavaScript.</p></noscript><script>window.addEventListener('error',function(){var a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.textContent='Bloom не удалось запустить. Обнови страницу в Safari.';});</script><script>
const $=id=>document.getElementById(id), day=()=>new Date().toLocaleDateString('sv-SE'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S;try{S=JSON.parse(localStorage.getItem('bloom-v1'))}catch{};S=S||{name:'',skin:0,hair:0,style:0,eyes:0,dress:0,face:0,xp:0,coins:0,owned:[0],days:{},mem:[],custom:[],started:false};let tab=S.started?'today':'character';const skins=['#f3cdb2','#e6b18e','#c78e68','#966348','#704631'],hairs=['#593c35','#b78b52','#332d32','#a35c43','#d6b89b','#75628b'],eyes=['#5e806e','#72533e','#6689a5','#55505e'],dresses=['#a8b5a2','#e8cdd2','#b9b0d7','#d6b46e','#779a9d','#8a638d'];const names=['Льняное платье','Розовый лепесток','Лавандовый сон','Золотая осень','Лесная странница','Лунная магия'];const pool=[['Убрать пять вещей на место',2],['Разобрать часть сушилки',5],['Протереть зеркало',3],['Проверить, нужен ли растениям полив',3],['Сделать лёгкую растяжку',5],['Устроить вечерний уход',5],['Прочитать две страницы книги',5],['Узнать один интересный факт',5],['Сделать красивую фотографию',3],['Выпить чай без телефона',5],['Прогуляться на свежем воздухе',10],['Поговорить с близким человеком',10],['Попробовать новый рецепт',20],['Записать идею и первый шаг',5],['Выделить время на отдых',10]];function save(){try{localStorage.setItem('bloom-v1',JSON.stringify(S));return true}catch(e){alert('Не удалось сохранить: хранилище недоступно или заполнено. Экспортируй данные.');return false}}function D(){return S.days[day()]||(S.days[day()]={energy:0,mood:0,quests:[],closed:false,main:''})}function level(){return 1+Math.floor(S.xp/100)}function go(t){tab=t;if(t==="world")selectedLand="";render()}function editableAvatar(){let h=hairs[S.hair],s=skins[S.skin],e=eyes[S.eyes],d=dresses[S.dress];return `<svg class="avatar" viewBox="0 0 260 330" xmlns="http://www.w3.org/2000/svg"><defs><filter id="soft"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter></defs><g opacity=".5" fill="#a8b5a2"><ellipse cx="130" cy="307" rx="76" ry="9"/><path d="M32 290Q10 240 42 210Q25 255 50 290M225 290Q250 240 222 220Q236 260 210 290"/></g><g filter="url(#soft)"><path fill="${h}" d="M82 104Q65 20 130 22Q195 20 180 112L${S.style===0?185:165} ${S.style===0?184:118}Q130 155 ${S.style===0?75:95} ${S.style===0?184:118}Z"/><path fill="${s}" d="M116 111L115 144H145L144 111M109 255L107 298H123L130 255M135 255L139 298H155L151 255"/><path fill="#655448" d="M106 292Q90 302 101 307H124V294M139 294V307H161Q169 301 154 292"/><path stroke="${s}" stroke-width="17" stroke-linecap="round" d="M105 151L79 218M155 151L181 218"/><path fill="${d}" stroke="#ffffff88" stroke-width="2" d="M109 137Q130 153 151 137L165 171L150 190Q177 229 184 265Q130 283 76 265Q84 229 110 190L95 171Z"/><path fill="none" stroke="#fff9" stroke-width="3" d="M110 190Q130 196 150 190M116 201L103 257M144 201L157 257"/><ellipse cx="130" cy="83" rx="${S.face===1?39:35}" ry="43" fill="${s}"/><path fill="${h}" d="M91 79Q75 27 130 29Q181 27 169 78Q148 67 135 48Q115 74 91 79Z"/>${S.style===2?`<circle cx="130" cy="24" r="20" fill="${h}"/>`:''}<g fill="${e}"><ellipse cx="116" cy="85" rx="4" ry="5"/><ellipse cx="144" cy="85" rx="4" ry="5"/></g><g fill="#d88e87" opacity=".5"><ellipse cx="108" cy="97" rx="7" ry="4"/><ellipse cx="152" cy="97" rx="7" ry="4"/></g><path d="M124 105Q130 110 136 105" fill="none" stroke="#a65e60" stroke-width="2" stroke-linecap="round"/>${S.dress>0?'<circle cx="130" cy="151" r="5" fill="#e5c27b"/>':''}</g></svg>`}function avatar(){return '<div class="painted-avatar"><img src="./heroine.webp" alt="Акварельная странница"></div><details><summary>Настраиваемый образ · прототип</summary>'+editableAvatar()+'</details>'}function select(k,labels){return `<select onchange="S.${k}=+this.value;save();render()">${labels.map((x,i)=>`<option value="${i}" ${S[k]===i?'selected':''}>${x}</option>`).join('')}</select>`}function character(){return `<div class="hero"><small>ТВОЯ ИСТОРИЯ</small><h1>${S.started?'Моя героиня':'Создай свою героиню'}</h1><p>Маленькое начало большого волшебного мира.</p></div><div class="grid"><div class="card">${avatar()}<h2>${esc(S.name||'Странница')} · уровень ${level()}</h2><div class="bar"><i style="width:${S.xp%100}%"></i></div><p class="muted">${S.xp%100} / 100 XP до нового уровня</p></div><div class="card controls"><label>Имя</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()" placeholder="Имя героини"><label>Форма лица</label>${select('face',['Овальное','Круглое'])}<label>Оттенок кожи</label>${select('skin',['Фарфор','Персик','Мёд','Карамель','Какао'])}<label>Причёска</label>${select('style',['Длинные волосы','Короткие волосы','Пучок'])}<label>Цвет волос</label>${select('hair',['Каштан','Золото','Тёмный','Медь','Светлый','Лиловый'])}<label>Цвет глаз</label>${select('eyes',['Зелёный','Карий','Голубой','Серый'])}<p><button class="primary" onclick="S.started=true;save();go('today')">${S.started?'Вернуться к дню':'Начать путешествие'}</button></p></div></div><div class="card"><h2>Гардероб</h2><div class="row">${names.map((n,i)=>`<button onclick="wear(${i})" class="${S.dress===i?'active':''}">${S.owned.includes(i)?'✿':'🔒'} ${n}${S.owned.includes(i)?'':` · ${i*20} монет`}</button>`).join('')}</div></div>`}function wear(i){if(!S.owned.includes(i)){if(S.coins<i*20)return alert('Пока недостаточно монет.');if(!confirm('Открыть наряд за '+i*20+' монет?'))return;S.coins-=i*20;S.owned.push(i)}S.dress=i;save();render()}function generate(){let d=D();if(d.generated||d.quests.some(q=>!q.customId))return;d.generated=true;let a=pool.filter(x=>x[1]<=(d.energy<=2?5:20));a.sort(()=>Math.random()-.5);d.quests.push(...a.slice(0,d.energy<=2?2:3).map(x=>({text:x[0],min:x[1],done:false})));syncCustom();save()}function rate(k,v){D()[k]=v;if(k==='energy')generate();save();render()}function toggle(i){let q=D().quests[i];q.done=!q.done;S.xp+=(q.done?1:-1)*(q.rewardXP??15);S.coins+=(q.done?1:-1)*(q.rewardCoins??5);save();render()}function replace(i){let d=D(),q=d.quests[i];if(q.done)return;let a=pool.filter(x=>!d.quests.some(y=>y.text===x[0])&&x[1]<=(d.energy<=2?5:20));if(a.length){let x=a[Math.floor(Math.random()*a.length)];d.quests[i]={text:x[0],min:x[1],done:false};save();render()}}function today(){let d=D();syncCustom();save();return `<div class="hero"><small>${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</small><h1>Привет, ${esc(S.name||'странница')}!</h1><p>Сегодня достаточно одного маленького шага.</p></div><div class="grid"><div class="card"><h2>Как ты сегодня?</h2>${['energy','mood'].map(k=>`<p>${k==='energy'?'Энергия':'Настроение'}</p><div class="row">${[1,2,3,4,5].map(v=>`<button class="${d[k]===v?'active':''}" onclick="rate('${k}',${v})">${v}</button>`).join('')}</div>`).join('')}<p class="muted">${d.energy&&d.energy<=2?'Сегодня можно выбрать щадящий ритм.':'Выбери свой ритм.'}</p><label>Главное дело</label><input value="${esc(d.main)}" onchange="D().main=this.value;save()" placeholder="Одно маленькое действие"></div><div class="card"><h2>Квесты дня</h2>${d.quests.length?d.quests.map((q,i)=>`<div class="quest"><button onclick="toggle(${i})">${q.done?'✓':'○'}</button><span class="${q.done?'done':''}">${esc(q.text)}<br><small>${q.min?q.min+' мин · ':''}${q.rewardXP??15} XP · ${q.rewardCoins??5} монет</small></span>${q.done?'':`<button onclick="replace(${i})" aria-label="Заменить">↻</button>`}</div>`).join(''):'<p>Отметь энергию, чтобы получить задания.</p>'}<p><button onclick="addQuest()">+ Свой квест</button> <button onclick="rest()">День отдыха</button></p></div></div><div class="card"><h2>Вечерняя глава</h2><textarea id="evening" placeholder="Что сегодня порадовало или запомнилось?">${esc(d.note||'')}</textarea><p><button class="primary" onclick="closeDay()">${d.closed?'Сохранить итог':'Закрыть день и открыть сундук'}</button></p><p id="reward" class="muted">${d.closed?'Сундук дня уже открыт. +20 XP и 10 монет.':''}</p></div>`}function addQuest(){let t=prompt('Название задания');if(t?.trim()){D().quests.push({text:t.trim(),min:0,done:false});save();render()}}function rest(){let d=D();if(!d.quests.some(q=>q.text==='Время для восстановления'))d.quests.push({text:'Время для восстановления',min:0,done:false});save();render()}function closeDay(){let d=D();d.note=$('evening').value;if(!d.closed){d.closed=true;S.xp+=20;S.coins+=10}save();render()}const rewards=[[10,5],[20,10],[40,20],[100,50]], difficulty=['Маленький шаг','Обычное дело','Значительное дело','Большое достижение'], sphereLands=['garden','garden','garden','house','house','forest','house','forest','forest','garden'];let editQuest=-1;function questForm(c={}){return '<label>Название</label><input id="qt" value="'+esc(c.text||'')+'" placeholder="Название задания"><label>Описание</label><textarea id="qdesc">'+esc(c.desc||'')+'</textarea><label>Сфера жизни</label><select id="qs">'+spheres.map((x,i)=>'<option value="'+i+'" '+(i===(c.sphere??3)?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Сложность</label><select id="qdiff">'+difficulty.map((x,i)=>'<option value="'+i+'" '+(i===(c.diff??0)?'selected':'')+'>'+x+' · '+rewards[i][0]+' XP / '+rewards[i][1]+' монет</option>').join('')+'</select><label>Минуты</label><input id="qm" type="number" min="0" max="1440" value="'+(c.min||5)+'"><label>Повторение</label><select id="qr">'+[['daily','Ежедневно'],['weekly','Еженедельно'],['monthly','Ежемесячно'],['once','Однократно']].map(([k,v])=>'<option value="'+k+'" '+(c.repeat===k?'selected':'')+'>'+v+'</option>').join('')+'</select><label>Дата начала</label><input type="date" id="qd" value="'+esc(c.date||day())+'"><p><button class="primary" onclick="addCustom()">'+(editQuest<0?'Добавить':'Сохранить')+'</button></p>'}function quests(){return '<div class="card controls"><h2>Мои задания</h2>'+questForm(S.custom[editQuest]||{})+S.custom.map((c,i)=>'<div class="quest"><span>'+esc(c.text)+'<br><small>'+esc(spheres[c.sphere]||'Без категории')+' · '+esc(c.date)+'</small></span><button onclick="editQuest='+i+';render()">Изменить</button><button onclick="if(confirm(\'Удалить шаблон? История сохранится.\')){S.custom.splice('+i+',1);editQuest=-1;save();render()}">×</button></div>').join('')+'</div><div class="card"><h2>История достижений</h2>'+[1,7,30].map(n=>{let from=new Date();from.setDate(from.getDate()-n+1);let ds=Object.entries(S.days).filter(([d])=>d>=from.toLocaleDateString('sv-SE')&&d<=day());return '<p>'+n+' дн. · '+ds.reduce((a,[d,v])=>a+v.quests.filter(q=>q.done).length,0)+' выполнено</p>'}).join('')+spheres.map((x,i)=>'<p>'+x+' · '+Object.values(S.days).reduce((a,d)=>a+d.quests.filter(q=>q.done&&q.sphere===i).length,0)+'</p>').join('')+'</div>'}function due(c){let now=day();if(now<c.date)return false;return c.repeat==='daily'||c.repeat==='once'&&now===c.date||c.repeat==='weekly'&&new Date(now+'T12:00:00').getDay()===c.weekday||c.repeat==='monthly'&&now.slice(8)===c.date.slice(8)}function syncCustom(){let d=D();for(let c of S.custom)if(due(c)&&!d.quests.some(q=>q.customId===c.id&&c.id||q.text===c.text)){d.quests.push({...c,customId:c.id,done:false})}}function addCustom(){let t=$('qt').value.trim(),date=$('qd').value;if(!t||!date)return;let old=S.custom[editQuest],diff=+$('qdiff').value,sphere=+$('qs').value;let c={id:old?.id||Date.now().toString(),text:t,desc:$('qdesc').value,sphere,land:sphereLands[sphere],diff,min:Math.max(0,Math.min(1440,+$('qm').value||0)),rewardXP:rewards[diff][0],rewardCoins:rewards[diff][1],repeat:$('qr').value,date,weekday:new Date(date+'T12:00:00').getDay()};if(editQuest<0)S.custom.push(c);else S.custom[editQuest]=c;editQuest=-1;syncCustom();save();render()}function journal(){return `<div class="card"><h2>Коллекция жизни</h2><p class="muted">Моменты, которые хочется сохранить.</p><textarea id="memo" placeholder="Что произошло?"></textarea><p><input type="file" id="photo" accept="image/*"></p><button class="primary" onclick="memory()">Сохранить момент</button></div>${S.mem.map((m,i)=>`<div class="card memory"><small>${esc(m.date)}</small><p>${esc(m.text)}</p>${m.photo?`<img src="${esc(m.photo)}">`:''}<p><button onclick="if(confirm('Удалить запись?')){S.mem.splice(${i},1);save();render()}">Удалить</button></p></div>`).reverse().join('')}`}async function memory(){let t=$('memo').value,f=$('photo').files[0],photo='';if(!t&&!f)return;if(f){try{let img=await createImageBitmap(f),c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(img.width,img.height));c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65)}catch{alert('Не удалось открыть фото. Попробуй JPEG.');return}}S.mem.push({date:day(),text:t,photo});if(!save())S.mem.pop();render()}const lands={house:{name:'Дом странницы',icon:'⌂',desc:'Дом, порядок и уют',items:['Цветы у входа','Уютная скамейка','Волшебный фонарь','Веранда']},garden:{name:'Сад жизни',icon:'✿',desc:'Здоровье, отдых и забота о себе',items:['Семена цветов','Клумба','Качели','Беседка']},forest:{name:'Лес пробуждения',icon:'♧',desc:'Знания, отношения и впечатления',items:['Лесной фонарь','Место для чтения','Кристалл','Мостик']}};let selectedLand='';function category(q){if(lands[q.land])return q.land;return /убра|сушил|зеркал|рецепт|постель|порядок|дом/i.test(q.text)?'house':/растен|полив|растяж|уход|чай|отдых|восстанов|спорт|здоров/i.test(q.text)?'garden':'forest'}function landXP(k){return Object.values(S.days).reduce((n,d)=>n+(d.quests||[]).filter(q=>q.done&&category(q)===k).reduce((a,q)=>a+(q.rewardXP??15),0),0)}function landLevel(k){return Math.min(10,1+Math.floor(landXP(k)/100))}function openLand(k){selectedLand=k;render()}function buyLand(k,i){let l=lands[k],cost=[50,100,150,250][i];if(!l||landLevel(k)<[1,2,3,4][i])return;S.landItems=S.landItems||{};let owned=S.landItems[k]||(S.landItems[k]=[]);if(owned.includes(i)||S.coins<cost)return;if(!confirm('Приобрести «'+l.items[i]+'» за '+cost+' монет?'))return;S.coins-=cost;owned.push(i);save();render()}function world(){let k=selectedLand,l=lands[k];if(l){let xp=landXP(k),lv=landLevel(k),owned=(S.landItems||{})[k]||[];return `<button class="map-back" onclick="openLand('')">← Карта мира</button><div class="hero"><small>${l.desc}</small><h1>${l.icon} ${l.name}</h1><p>Уровень ${lv} · ${['Зарождение','Пробуждение','Расцвет','Процветание','Волшебство'][lv===1?0:lv<=3?1:lv<=5?2:lv<=8?3:4]}</p><div class="bar"><i style="width:${lv===10?100:xp%100}%"></i></div><p>${xp} XP · ${lv===10?'Максимальный уровень':100-xp%100+' XP до следующего уровня'}</p></div><div class="card"><h2>Мои улучшения</h2><p>${owned.length?owned.map(i=>l.items[i]).join(' · '):'Здесь появятся твои первые приобретения.'}</p><h2>Мастерская</h2>${l.items.map((item,i)=>`<div class="quest"><span>${item}<br><small>${owned.includes(i)?'Приобретено':[50,100,150,250][i]+' монет · уровень '+[1,2,3,4][i]}</small></span><button ${owned.includes(i)||lv<[1,2,3,4][i]||S.coins<[50,100,150,250][i]?'disabled':''} onclick="buyLand('${k}',${i})">${owned.includes(i)?'✓':'Купить'}</button></div>`).join('')}<p class="muted">Визуальное размещение предметов появится в следующем обновлении.</p></div><div class="card"><h2>Квесты этой локации</h2>${D().quests.filter(q=>category(q)===k).map(q=>'<p>'+ (q.done?'✓ ':'○ ')+esc(q.text)+'</p>').join('')||'<p>Сегодня пока нет заданий этой локации.</p>'}<button onclick="go('today')">К заданиям дня</button></div>`}return `<div class="hero"><h1>Мой мир</h1><p>Твои реальные действия преображают мир.</p></div><div class="worldmap"><svg viewBox="0 0 340 300" aria-hidden="true"><rect width="340" height="300" rx="24" fill="#e5e9d5"/><path d="M0 245 Q90 170 160 230 T340 200" fill="none" stroke="#a9cbd0" stroke-width="28"/><path d="M80 85 Q160 90 255 90 Q260 165 170 220 Q95 160 80 85" fill="none" stroke="#c8ae80" stroke-width="9" stroke-dasharray="3 5"/><g fill="#b6c7a0"><circle cx="25" cy="35" r="20"/><circle cx="310" cy="40" r="25"/><circle cx="45" cy="180" r="25"/><circle cx="310" cy="155" r="22"/></g></svg>${Object.entries(lands).map(([key,v])=>`<button class="mapnode ${key}" onclick="openLand('${key}')"><b>${v.icon}</b>${v.name}<small>Уровень ${landLevel(key)}</small></button>`).join('')}</div><div class="card"><h2>Как растёт мир</h2><p>Каждый выполненный квест приносит опыт своей локации. Каждые 100 XP открывают новый уровень. Пропущенные дни ничего не отнимают.</p><p class="muted">Карта пока схематическая. Акварельные стадии будут подключены после проверки механики.</p></div><div class="card"><h2>Резервная копия</h2><button onclick="backup()">Экспорт JSON</button><p><input type="file" accept=".json" onchange="restore(this)"></p></div>`} function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='bloom-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.days||!Array.isArray(x.mem)||!Array.isArray(x.owned)||!Array.isArray(x.custom)||typeof x.xp!=='number')throw Error();if(confirm('Заменить текущие записи резервной копией?')){let old=S;S=x;if(!save())S=old;render()}}catch{alert('Не удалось прочитать копию Bloom.')}}function treasury(){let n=Object.values(S.days).filter(d=>d.closed).length;return '<div class="hero"><small>НАГРАДЫ</small><h1>Сокровищница</h1><p>Каждый маленький шаг имеет значение.</p></div><div class="card"><h2>Будущие сокровища</h2><img class="scene" src="./treasury-concept.webp" alt="Концепция сундуков и артефактов"><p class="muted">Коллекции и редкие предметы пока в разработке.</p></div><div class="card"><h2>✧ '+S.coins+' монет</h2><p>Открыто ежедневных сундуков: '+n+'</p><button onclick="go(\'character\')">Открыть гардероб</button></div><div class="card"><h2>Первые шаги</h2><p>'+Math.min(n,7)+' / 7 завершённых дней</p><div class="bar"><i style="width:'+Math.min(100,n/7*100)+'%"></i></div></div>'}const spheres=['Здоровье','Физическая активность','Забота о себе','Дом и уют','Любовь и отношения','Карьера','Финансы и свобода','Саморазвитие','Впечатления','Эмоциональное состояние'];function wheel(b){let colors=['#83a68b','#a8b77d','#dba6b3','#c6a16e','#c98b9c','#8c9dbd','#d6b45e','#a995c4','#7fb5b4','#b5a2c5'];let pt=(i,r)=>[150+Math.sin(i*Math.PI/5)*r,150-Math.cos(i*Math.PI/5)*r].join(',');return '<svg viewBox="0 0 300 300" role="img" aria-label="Колесо удовлетворённости" style="width:100%;max-width:340px;display:block;margin:auto">'+Array.from({length:10},(_,i)=>'<path d="M150,150 L'+pt(i-.5,110)+' A110,110 0 0,1 '+pt(i+.5,110)+' Z" fill="'+colors[i]+'" opacity=".15"/>'+ (b[i]?'<path d="M150,150 L'+pt(i-.5,b[i]*11)+' A'+b[i]*11+','+b[i]*11+' 0 0,1 '+pt(i+.5,b[i]*11)+' Z" fill="'+colors[i]+'"/>':'')+'<text x="'+pt(i,132).split(',')[0]+'" y="'+pt(i,132).split(',')[1]+'" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#51452f">'+(i+1)+'</text>').join('')+[22,44,66,88,110].map(r=>'<circle cx="150" cy="150" r="'+r+'" fill="none" stroke="#8b795b" stroke-opacity=".3"/>').join('')+'</svg>'}function journey(){let month=day().slice(0,7),b=(S.balanceRatings||{})[month]||{};let ds=Object.values(S.days);return '<div class="hero"><h1>Мой путь</h1><p>История твоих маленьких и больших открытий.</p></div><div class="card"><h2>Моя жизнь в цифрах</h2><p>Завершённых дней: '+ds.filter(d=>d.closed).length+'</p><p>Выполненных квестов: '+ds.reduce((n,d)=>n+d.quests.filter(q=>q.done).length,0)+'</p><p>Воспоминаний: '+S.mem.length+'</p></div><div class="card"><h2>Колесо баланса</h2><p class="muted">Личная удовлетворённость · '+month+' · оценки от 1 до 10. Не оценка твоей продуктивности.</p>'+wheel(b)+spheres.map((x,i)=>'<label style="display:block;margin:16px 0 5px">'+(i+1)+'. '+x+'</label><select onchange="setBalance('+i+',this.value)"><option value="">Не оценено</option>'+Array.from({length:10},(_,j)=>'<option '+(b[i]===j+1?'selected':'')+' value="'+(j+1)+'">'+(j+1)+'</option>').join('')+'</select>').join('')+'</div>'}function setBalance(i,v){let m=day().slice(0,7);S.balanceRatings=S.balanceRatings||{};let b=S.balanceRatings[m]||(S.balanceRatings[m]={});if(v)b[i]=+v;else delete b[i];save();render()}
function render(){$('balance').textContent=`✦ ${S.coins} · ур. ${level()}`;$('nav').innerHTML=[['today','☀ Сегодня'],['world','✿ Мир'],['quests','✓ Квесты'],['journal','♡ Дневник'],['character','♙ Героиня'],['treasury','✧ Награды'],['journey','❋ Мой путь']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')"><span class="ni">${n.split(" ")[0]}</span>${n.split(" ").slice(1).join(" ")}</button>`).join('');$('app').innerHTML=({today,world,quests,journal,character,treasury,journey}[tab])()}render();</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);</script></html>

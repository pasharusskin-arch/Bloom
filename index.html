const wardrobeItems=[['cape','Накидка странницы','cape',60,'coins','<path d="M103 140L65 235Q130 250 195 235L157 140" fill="#947f9d" opacity=".85"/>'],['cloak','Лунная мантия','cape',5,'crystals','<path d="M103 140L58 265Q130 280 202 265L157 140" fill="#65748d" opacity=".9"/><path d="M75 240l5-10 5 10-5 10zM180 220l5-10 5 10-5 10z" fill="#f4d89a"/>'],['boots','Лесные сапожки','shoes',45,'coins','<path d="M105 275h19v30h-25v-10zM137 275h19l7 30h-26z" fill="#795c49"/>'],['slippers','Золотые туфельки','shoes',3,'crystals','<path d="M105 294h19v13H99zM137 294h19l7 13h-26z" fill="#d9b56c"/>'],['earrings','Жемчужные серьги','jewelry',40,'coins','<g fill="#fff2d9" stroke="#c4a46d"><circle cx="95" cy="99" r="4"/><circle cx="165" cy="99" r="4"/></g>'],['pendant','Лунный кулон','jewelry',4,'crystals','<path d="M115 137q15 22 30 0" fill="none" stroke="#d9b56c" stroke-width="2"/><circle cx="130" cy="153" r="5" fill="#e7d6ff"/>'],['wreath','Цветочный венок','head',70,'coins','<path d="M91 49Q130 18 169 49" stroke="#829b71" stroke-width="6" fill="none"/><g fill="#e8aebc"><circle cx="100" cy="43" r="6"/><circle cx="120" cy="34" r="6"/><circle cx="141" cy="34" r="6"/><circle cx="160" cy="43" r="6"/></g>'],['crown','Звёздная диадема','head',8,'crystals','<path d="M98 48l8-20 14 13 10-23 10 23 14-13 8 20z" fill="#e5c27b" stroke="#b99654"/>'],['bag','Сумка путешественницы','hand',55,'coins','<path d="M176 211q15-20 25 0" fill="none" stroke="#98775b" stroke-width="4"/><rect x="174" y="210" width="30" height="27" rx="6" fill="#b68c69"/>'],['staff','Посох рассвета','hand',6,'crystals','<path d="M181 290l12-123" stroke="#9b795e" stroke-width="5"/><circle cx="193" cy="160" r="10" fill="#d9c4ed" stroke="#c4a46d"/>']];const wardrobeSlots={cape:'Накидки',shoes:'Обувь',jewelry:'Украшения',head:'Головные уборы',hand:'Аксессуары'};function wardrobeInit(){S.gearOwned??=[];S.gearEquipped??={};S.crystals??=0}function gearLayer(slot){let id=(S.gearEquipped||{})[slot];return wardrobeItems.find(x=>x[0]===id&&x[2]===slot)?.[5]||''}function equipGear(id){wardrobeInit();let x=wardrobeItems.find(y=>y[0]===id);if(!x)return;if(!S.gearOwned.includes(id)){if(S[x[4]]<x[3])return alert('Пока недостаточно валюты.');if(!confirm('Приобрести «'+x[1]+'»?'))return;S[x[4]]-=x[3];S.gearOwned.push(id)}S.gearEquipped[x[2]]=S.gearEquipped[x[2]]===id?null:id;save();render()}function wardrobeView(){wardrobeInit();return '<div class="card"><h2>Волшебный гардероб</h2><p>✦ '+S.coins+' монет · ◇ '+S.crystals+' кристаллов</p>'+Object.entries(wardrobeSlots).map(([k,label])=>'<h3>'+label+'</h3>'+wardrobeItems.filter(x=>x[2]===k).map(x=>'<div class="quest"><div class="gear-preview"><svg viewBox="0 0 260 330" aria-hidden="true">'+x[5]+'</svg></div><span>'+x[1]+'<br><small>'+(S.gearOwned.includes(x[0])?'В коллекции':x[3]+(x[4]==='coins'?' монет':' кристаллов'))+'</small></span><button '+(!S.gearOwned.includes(x[0])&&S[x[4]]<x[3]?'disabled':'')+' onclick="equipGear(\''+x[0]+'\')">'+(S.gearEquipped[k]===x[0]?'Снять':S.gearOwned.includes(x[0])?'Надеть':'Купить')+'</button></div>').join('')).join('')+'</div>'}function wear(i){if(!S.owned.includes(i)){if(S.coins<i*20)return alert('Пока недостаточно монет.');if(!confirm('Открыть наряд за '+i*20+' монет?'))return;S.coins-=i*20;S.owned.push(i)}S.dress=i;save();render()}function pref(x){return (S.questPrefs||{})[x.id]||{}}function pickQuest(a){let weights=a.map(x=>pref(x).like?4:1),n=Math.random()*weights.reduce((a,b)=>a+b,0);return a.find((x,i)=>(n-=weights[i])<0)||a[0]}function feedback(i,action){let d=D(),q=d.quests[i];if(!q?.libraryId||d.closed)return;S.questPrefs=S.questPrefs||{};let f=S.questPrefs[q.libraryId]||(S.questPrefs[q.libraryId]={});if(action==='like'){f.like=!f.like;save();render();return}if(q.done)return;if(action==='never')f.never=true;if(action==='hard')f.hard=true;if(action==='later')f.later=day();if(q.harmony){let a=candidates(d,q.sphere).filter(x=>x.min<=q.min);if(a.length)d.quests[i]={...makeAuto(pickQuest(a)),harmony:true,auto:fa оём ритме</h2><p>Как хочется прожить сегодняшний день?</p><div class="row">'+[['rest','Восстановление'],['normal','Обычный день'],['focus','Активный день']].map(([k,v])=>'<button class="'+(dayMode(d)===k?'active':'')+'" onclick="setMode(\''+k+'\')">'+v+'</button>').join('')+'</div><p class="muted">Лимит автоматических заданий вместе с шагом к гармонии: '+questLimit(d)+' мин. Свои дела не ограничиваются.</p></div>'}function refreshPending(){let d=D();if(!d.energy||d.closed)return;d.quests=d.quests.filter(q=>q.done||(!q.auto&&!q.harmony));d.generated=false;generate();ensureHarmony()}function candidates(d,sphere){let recent=new Set(Object.entries(S.days).filter(([k])=>k!==day()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,3).flatMap(([k,v])=>v.quests.map(q=>q.text)));let all=pool.filter(x=>eligible(x)&&(dayMode(d)!=='rest'||[0,2,9].includes(x.sphere)||sphere!==undefined)&&x.min<=questLimit(d)&&(sphere===undefined||x.sphere===sphere)&&!d.quests.some(q=>q.text===x.text));let fresh=all.filter(x=>!recent.has(x.text));return fresh.length?fresh:all}function makeAuto(x){let diff=x.min<=5?0:x.min<=15?1:2;return {text:x.text,min:x.min,sphere:x.sphere,land:sphereLands[x.sphere],diff,rewardXP:rewards[diff][0],rewardCoins:rewards[diff][1],auto:true,libraryId:x.id,done:false}}function generate(){let d=D();if(d.generated||d.closed)return;d.generated=true;let remaining=Math.max(0,questLimit(d)-d.quests.filter(q=>q.auto||q.harmony||q.programKey).reduce((n,q)=>n+q.min,0)),count=Math.max(0,(dayMode(d)==='rest'?2:3)-d.quests.filter(q=>q.auto).length);if(harmonyRatings()&&!d.harmonySkipped&&!d.quests.some(q=>q.harmony))remaining=Math.max(0,remaining-Math.min(5,remaining));for(let i=0;i<count;i++){let a=candidates(d).filter(x=>x.min<=remaining);if(!a.length)break;let used=new Set(d.quests.filter(q=>q.auto).map(q=>q.sphere)),diverse=a.filter(x=>!used.has(x.sphere));if(diverse.length)a=diverse;let recurring=i===0&&!d.quests.some(q=>q.workshop)?recurringPool(d).filter(x=>a.some(y=>y.id===x.id)):[];let x=pickQuest(recurring.length?recurring:a);d.quests.push({...makeAuto(x),...(x.workshop?{workshop:x.workshop,land:x.workshop.split('-')[0]}:{})});remaining-=x.min}syncCustom();save()}function rate(k,v){let d=D(),changed=d[k]!==v;d[k]=v;if(changed&&d.energy)refreshPending();save();render()}function toggle(i){let q=D().quests[i];if(!q||D().closed)return;if(q.done&&q.programKey&&S.programs?.[q.programKey]?.claimed){alert("Награда программы уже получена.");return}if(q.done&&S.coins<(q.rewardCoins??5)){alert("Монеты за этот квест уже потрачены. Отменить выполнение сейчас нельзя.");return}q.done=!q.done;S.xp+=(q.done?1:-1)*(q.rewardXP??15);S.coins+=(q.done?1:-1)*(q.rewardCoins??5);save();render()}function replace(i){let d=D(),q=d.quests[i];if(!q||q.done||q.customId||q.programKey||d.closed)return;let remaining=questLimit(d)-d.quests.filter((y,j)=>j!==i&&(y.auto||y.harmony||y.programKey)).reduce((n,y)=>n+y.min,0);let a=candidates(d,q.sphere).filter(x=>x.min<=remaining);if(!a.length)a=candidates(d).filter(x=>x.min<=remaining);if(!a.length){alert('Других подходящих заданий пока нет.');return}d.quests[i]=makeAuto(pickQuest(a));save();render()}function skipQuest(i){let q=D().quests[i];if(!q||q.done||q.customId||q.programKey||D().closed)return;D().quests.splice(i,1);save();render()}function harmonyRatings(){let all=S.balanceRatings||{},m=Object.keys(all).filter(k=>k<=day().slice(0,7)&&Object.keys(all[k]).length===spheres.length).sort().pop();return m?all[m]:null}function ensureHarmony(){let d=D(),b=harmonyRatings();if(!d.energy||!b||d.closed||d.harmonySkipped||d.quests.some(q=>q.harmony))return;let history=Object.entries(S.days).filter(([k])=>k!==day()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);let ids=spheres.map((_,i)=>i).filter(i=>b[i]<10&&!(S.harmonyExcluded||[]).includes(i));let min=Math.min(...ids.map(i=>b[i]));ids=ids.filter(i=>b[i]<=min+1).sort((a,c)=>history.filter(([k,v])=>v.quests.some(q=>q.harmony&&q.sphere===a)).length-history.filter(([k,v])=>v.que const profileQuestions=[['routine','Как проходит твой день?',['Работа вне дома','Удалённая работа','Учёба','Свободный график']],['home','Что есть в твоём мире?',['Комнатные растения','Домашние животные','Сад или дача','Автомобиль','Место для творчества']],['family','С кем ты делишь свою жизнь?',['Партнёр','Дети','Родные','Живу самостоятельно']],['movement','Какая активность тебе подходит?',['Прогулки','Лёгкая растяжка','Тренировки','Предпочитаю спокойные занятия']],['rest','Что помогает восстановиться?',['Чтение','Музыка','Прогулки','Игры','Общение','Тишина','Творчество','Уход за собой']],['interests','Что тебе интересно?',['Книги','Языки','Творчество','Кулинария','Путешествия','Музыка','Обучение']],['career','Что актуально в работе?',['Профессиональный рост','Поиск работы','Новые навыки','Баланс работы и отдыха']],['money','Какие финансовые темы актуальны?',['Накопления','Планирование бюджета','Финансовая цель']],['time','Сколько времени удобно уделять заданиям?',['До 5 минут','До 15 минут','До 30 минут','Больше 30 минут']],['goals','Чего хочется от Bloom?',['Больше радости','Порядок и уют','Забота о себе','Баланс','Отношения','Карьера','Новые впечатления','Финансовые цели']]];let profileStep=0,profileOpen=false,profileDraft={};function beginProfile(){profileDraft=JSON.parse(JSON.stringify(S.profile||{}));profileStep=0;profileOpen=true;render()}function chooseProfile(i){let [k,t,opts]=profileQuestions[profileStep],v=opts[i],a=profileDraft[k]||[];profileDraft[k]=k==='time'?(a.includes(v)?[]:[v]):a.includes(v)?a.filter(x=>x!==v):[...a,v];render()}function nextProfile(skip){if(skip)profileDraft[profileQuestions[profileStep][0]]=[];if(profileStep<profileQuestions.length-1){profileStep++;render()}else finishProfile()}function finishProfile(){S.profile=profileDraft;S.profileDone=true;save();profileOpen=false;render()}function profileView(){let [k,title,opts]=profileQuestions[profileStep];return '<div class="hero"><small>ДАВАЙ ПОЗНАКОМИМСЯ · '+(profileStep+1)+' / '+profileQuestions.length+'</small><h1>'+title+'</h1><p>Выбирай только то, чем хочется поделиться. Ответы остаются на устройстве.</p><div class="bar"><i style="width:'+((profileStep+1)/profileQuestions.length*100)+'%"></i></div></div><div class="card profile-options">'+opts.map((v,i)=>'<button class="'+((profileDraft[k]||[]).includes(v)?'active':'')+'" onclick="chooseProfile('+i+')">'+esc(v)+'</button>').join('')+'<p><button class="primary" onclick="nextProfile(false)">'+(profileStep===profileQuestions.length-1?'Сохранить профиль':'Далее')+'</button> <button onclick="nextProfile(true)">Пропустить</button></p>'+(profileStep?'<button onclick="profileStep--;render()">← Назад</button>':'')+'<p><button onclick="finishProfile()">Завершить сейчас</button> <button onclick="profileOpen=false;render()">Отмена</button></p></div>'}function profileCard(){return '<div class="card"><h2>Мой профиль</h2><p>Расскажи о своём образе жизни, интересах и целях.</p><button onclick="beginProfile()">'+(S.profileDone?'Изменить ответы':'Пройти опрос')+'</button></div>'}function info(){return `<div class="hero"><small>BLOOM · ИСКУССТВО ЖИТЬ</small><h1>Твоя жизнь — твоя история</h1><p>Не стать идеальной, а замечать, как расцветает твоя жизнь.</p></div><div class="card"><h2>Замысел Bloom</h2><p>Bloom — личный дневник и маленький сказочный мир. Заботясь о себе, близких, доме и мечтах, ты развиваешь героиню и её мир. Игра помогает замечать реальные шаги, а не оценивать твою ценность.</p></div><div class="card"><h2>Как начать</h2><p>1. Создай героиню и заполни анкету интересов.</p><p>2. Отметь настроение и энергию, выбери ритм дня.</p><p>3. Выполняй подходящие квесты или создавай свои.</p><p>4. Сохраняй воспоминания и завершай день, когда удобно.</p><p>5. Раз в месяц оценивай сферы жизни в колесе баланса.</p><button onclick="go('today')">Начать день</button></div><div class="card"><h2>Правила доброго путешествия</h2><p>Отдых — тоже достижение. Пропущенные задания и дни не повод для штрафов. Можно заменять задания, менять сроки и ставить цели на паузу. Колесо баланса отражает твою удовлетворённость, а не продуктивность. Оценки меняешь только ты.</p></div><div class="card"><h2>Опыт и сокровища</h2><p>Квесты приносят опыт и монеты. Каждые 100 XP повышают уровень героини. Образы открываются бесплатно за уровни. Монеты и кристаллы можно обменивать на улучшения мира, артефакты и питомцев. Кристаллы также доступны за достижения и исполненные мечты. Завершённый день открывает возможность получить сундук; неоткрытые сундуки не сгорают.</p><button onclick="go('treasury')">Сокровищница</button></div><div class="card"><h2>Твой мир и мечты</h2><p>Дом, сад и лес развиваются благодаря заданиям соответствующих сфер. В разделе «Мой путь» можно создавать цели, отмечать этапы, связывать количественные цели с квестами и назначать реальные награды. «Шаг к гармонии» предлагает дополнительное задание для сферы, которой хочется уделить внимание.</p><button onclick="go('journey')">Мой путь</button></div><div class="card"><h2>Личное пространство</h2><p>Дневник и игровой прогресс хранятся локально в браузере. Они не синхронизируются автоматически между устройствами. Сохраняй резервные копии: очистка данных сайта может удалить историю. Системные напоминания пока не подключены.</p><p class="muted">Bloom — инструмент самонаблюдения, а не медицинская или психологическая диагностика.</p></div>`}function quickLinks(){return `<div class="quick-links" aria-label="Быстрые переходы"><button onclick="go(\'quests\')"><b>✓</b>Мои квесты</button><button onclick="go(\'journey\')"><b>❋</b>Мои цели</button><button onclick="go(\'treasury\')"><b>✧</b>Награды</button></div>`}function render(){outfitState();if(profileOpen){$('app').innerHTML=profileView();$('nav').style.display='none';return}$('nav').style.display='';$('balance').textContent=`✦ ${S.coins} · ур. ${level()}`;$('nav').innerHTML=[['today','☀ Сегодня'],['world','✿ Мир'],['quests','✓ Квесты'],['journal','♡ Дневник'],['character','♙ Героиня'],['treasury',

e};else{d.quests.splice(i,1);d.harmonySkipped=true}}else{let a=candidates(d,q.sphere).filter(x=>x.min<=q.min);if(!a.length)a=candidates(d).filter(x=>x.min<=q.min);if(a.length)d.quests[i]=makeAuto(pickQuest(a));else d.quests.splice(i,1)}save();render()}function feedbackView(q,i){if(!q.libraryId)return '';let f=(S.questPrefs||{})[q.libraryId]||{};return '<details class="quest-feedback"><summary>Предпочтения '+(f.like?'♥':'')+'</summary><button onclick="feedback('+i+',\'like\')">'+(f.like?'♥ Нравится':'♡ Предлагать чаще')+'</button>'+(!q.done?'<button onclick="feedback('+i+',\'later\')">Не сегодня</button><button onclick="feedback('+i+',\'hard\')">Слишком сложно</button><button onclick="feedback('+i+',\'never\')">Больше не предлагать</button>':'')+'</details>'}function preferenceSettings(){let entries=pool.filter(x=>{let f=pref(x);return f.like||f.never||f.hard});return '<div class="card"><h2>Мои предпочтения</h2><p>Bloom учитывает твою обратную связь. Здесь можно отменить любое решение.</p>'+ (entries.map(x=>'<p>'+esc(x.text)+' · '+(pref(x).never?'Скрыто':pref(x).hard?'Слишком сложно':'Любимое')+' <button onclick="resetPref(\''+x.id+'\')">Сбросить</button></p>').join('')||'<p>Пока нет сохранённых предпочтений.</p>')+'</div>'}function resetPref(id){delete S.questPrefs[id];save();render()}function eligible(x){let f=pref(x);if(f.never||f.hard||f.later===day())return false;if(!x.tag)return true;let [k,v]=x.tag.split(':');return (S.profile?.[k]||[]).includes(v)}function dayMode(d){return d.mode||((d.energy&&d.energy<=2)||(d.mood&&d.mood<=2)?'rest':'normal')}function questLimit(d){let t=S.profile?.time?.[0],cap=t==='До 5 минут'?5:t==='До 15 минут'?15:t==='До 30 минут'?30:t==='Больше 30 минут'?45:30;let energy=d.energy<=2?5:d.energy===3?15:45;let mode=dayMode(d);return Math.min(cap,energy,mode==='rest'?5:mode==='focus'?45:30)}function setMode(m){D().mode=m;refreshPending();save();render()}function rhythmCard(d){return '<div class="card"><h2>В своём ритме</h2><p>Как хочется п
